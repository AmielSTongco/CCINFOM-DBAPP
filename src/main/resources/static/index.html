<!DOCTYPE html>
<html>
    <head>
        <title>
            INFOM Website
        </title>
        <link rel = "stylesheet" href = "css/common.css">
    </head>

    <body>
        <div class = "navigation-menu">
            <div class = "navigation-menu-container">
                <div class = "menu-container">
                    <button class = "menu-button">
                        <img class = "button-img-2" src = "icons/menu.svg">
                    </button>
                </div>

                <div class = "dashboard-container">
                    <button class = "dashboard-button">
                        <img class = "button-img" src = "icons/dashboard.svg">
                        <span class = "button-text">
                            Dashboard
                        </span>
                    </button>
                </div>

                <div class = "modules-container">
                    <button class = "module-button">
                        <img class = "button-img" src = "icons/mod1.svg">
                        <span class = "button-text">
                            Patient Registration and Residence Reporting
                        </span>
                    </button>

                    <button class = "module-button">
                        <img class = "button-img" src = "icons/mod2.svg">
                        <span class = "button-text">
                            Module 2
                        </span>
                    </button>

                    <button class = "module-button">
                        <img class = "button-img" src = "icons/mod3.svg">
                        <span class = "button-text">
                            Module 3
                        </span>
                    </button>

                    <button class = "module-button">
                        <img class = "button-img" src = "icons/mod4.svg">
                        <span class = "button-text">
                            Module 4
                        </span>
                    </button>
                </div>

                <div class = "settings-container">
                    <img class = "button-img-2" src = "icons/logo.svg">

                    <button class = "settings-button">
                        <img class = "button-img-2" src = "icons/settings.svg">
                    </button>
                </div>
            </div>

        </div>

        <div class = "website-body">
        </div>

        <script src="js/common.js"></script>
    </body>
</html>
